# Finance AI — bot (8081) + admin (8082), shared ./data
# Usage:
#   docker compose up -d --build
#   docker compose --profile rag up -d --build

services:
  bot:
    build: .
    image: finance-ai:latest
    container_name: finance-ai-bot
    env_file:
      - .env
    environment:
      WEWORK_EXTERNAL_CALLBACK_PORT: "8081"
      MATERIALS_DIR: data/materials
      BROWSER_HEADLESS: "true"
    ports:
      - "8081:8081"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  admin:
    image: finance-ai:latest
    container_name: finance-ai-admin
    build: .
    command: ["python", "main.py", "admin"]
    env_file:
      - .env
    environment:
      ADMIN_PORT: "8082"
      MATERIALS_DIR: data/materials
    ports:
      - "8082:8082"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    depends_on:
      - bot
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: finance-ai-qdrant
    profiles: ["rag"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
